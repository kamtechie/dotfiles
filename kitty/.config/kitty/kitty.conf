# Set the font to JetBrainsMono Nerd Font
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto

# Font size (adjust as needed)
font_size 11.0

# A little breathing room and a slim cursor.
window_padding_width 8
cursor_shape beam


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# Set the font to JetBrainsMono Nerd Font
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto

# Font size (adjust as needed)
font_size 11.0

# Match the Catppuccin Mocha palette used by tmux.
include catppuccin-mocha.conf

# A little breathing room and a slim cursor.
window_padding_width 8
cursor_shape beam

# =============================================================================
# TMUX CONFIG — v1
# =============================================================================
#
# Mental model:
#   Hyprland workspace  ≈ tmux window
#   Hyprland window     ≈ tmux pane
#
# Prefix = Ctrl-a
# Press Ctrl-a, RELEASE, then press the command key.
# =============================================================================


# -----------------------------------------------------------------------------
# PREFIX
# -----------------------------------------------------------------------------

# Ctrl-b can get in the bin.
unbind C-b

# Ctrl-a is our tmux prefix.
set -g prefix C-a

# Remove the previous prefix binding when reloading an existing session.
unbind C-Space

# Ctrl-a twice sends a literal Ctrl-a to the program inside tmux.
bind C-a send-prefix


# -----------------------------------------------------------------------------
# GENERAL
# -----------------------------------------------------------------------------

# Enable mouse support.
#
# This gives us:
#   - scrolling
#   - clicking panes
#   - clicking windows in the status bar
#   - dragging pane borders
set -g mouse on

# Number windows from 1 instead of 0.
set -g base-index 1

# Number panes from 1 as well.
setw -g pane-base-index 1

# If window 2 disappears:
#
#   1  3  4
#
# automatically turn that back into:
#
#   1  2  3
set -g renumber-windows on

# Keep plenty of terminal history.
set -g history-limit 100000

# Reduce delay when tmux sees an Escape sequence.
# Makes terminal applications feel more responsive.
set -sg escape-time 10

# Tell applications inside tmux that we support 256 colours.
set -g default-terminal "tmux-256color"


# -----------------------------------------------------------------------------
# RELOAD CONFIG
# -----------------------------------------------------------------------------

# Ctrl-a r
#
# Reload ~/.tmux.conf without restarting tmux.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"


# -----------------------------------------------------------------------------
# CREATE PANES
# -----------------------------------------------------------------------------

# The default tmux split keys are weird, so remove them.
unbind %
unbind '"'

# Ctrl-a |
#
# ┌─────────┬─────────┐
# │         │         │
# │         │         │
# └─────────┴─────────┘
#
# The new pane starts in the current pane's directory.
bind | split-window -h -c "#{pane_current_path}"


# Ctrl-a -
#
# ┌───────────────────┐
# │                   │
# ├───────────────────┤
# │                   │
# └───────────────────┘
#
# Again, inherit the current directory.
bind - split-window -v -c "#{pane_current_path}"


# -----------------------------------------------------------------------------
# PANE NAVIGATION
# -----------------------------------------------------------------------------
#
# Similar mental model to your Hyprland Super + Arrow bindings.
#
# Ctrl-a → Arrow
#

bind Left  select-pane -L
bind Down  select-pane -D
bind Up    select-pane -U
bind Right select-pane -R


# -----------------------------------------------------------------------------
# PANE RESIZING
# -----------------------------------------------------------------------------
#
# Ctrl-a → Shift + Arrow
#
# -r means the key can repeat.
#
# So after Ctrl-a you can hold Shift+Right rather than repeatedly
# entering the prefix.
#

bind -r S-Left  resize-pane -L 5
bind -r S-Down  resize-pane -D 5
bind -r S-Up    resize-pane -U 5
bind -r S-Right resize-pane -R 5


# -----------------------------------------------------------------------------
# WINDOWS
# -----------------------------------------------------------------------------

# Ctrl-a c
#
# Create a new window, starting in the current directory.
bind c new-window -c "#{pane_current_path}"

# tmux already provides:
#
# Ctrl-a 1
# Ctrl-a 2
# Ctrl-a 3
# ...
#
# to jump directly between windows.


# -----------------------------------------------------------------------------
# CATPPUCCIN MOCHA-ISH COLOURS
# -----------------------------------------------------------------------------
#
# We're deliberately NOT installing a theme/plugin yet.
#
# Main colours:
#
# Base       #1e1e2e
# Mantle     #181825
# Surface    #313244
# Overlay    #6c7086
# Text       #cdd6f4
# Mauve      #cba6f7
#
# Mauve is our primary accent.
# -----------------------------------------------------------------------------

# Bottom status bar.
set -g status-style "bg=#181825,fg=#cdd6f4"

# Inactive window names.
setw -g window-status-style "fg=#6c7086,bg=#181825"

# Active window.
setw -g window-status-current-style "fg=#cba6f7,bg=#313244,bold"

# Inactive pane borders.
set -g pane-border-style "fg=#45475a"

# Active pane gets our purple accent.
set -g pane-active-border-style "fg=#cba6f7"

# tmux messages / command prompt.
set -g message-style "fg=#cba6f7,bg=#313244,bold"


# -----------------------------------------------------------------------------
# STATUS BAR CONTENT
# -----------------------------------------------------------------------------

# Left side: session name, with room for longer names.
set -g status-left-length 30
set -g status-left "#[fg=#cba6f7,bold] #S #[default]"

# Right side: time and date.
set -g status-right "#[fg=#6c7086]%H:%M #[fg=#cba6f7]%d %b "


# =============================================================================
# THAT'S IT.
# =============================================================================
#
# Resist adding another 400 lines from someone's GitHub dotfiles.
#
# Use tmux first.
# Change things when something actually annoys you.
#
# Useful built-in commands:
#
#   Ctrl-a c       new window
#   Ctrl-a 1..9    switch window
#   Ctrl-a |       side-by-side split
#   Ctrl-a -       top/bottom split
#   Ctrl-a Arrow   change pane
#   Ctrl-a S-Arrow resize pane
#   Ctrl-a x       kill pane
#   Ctrl-a &       kill window
#   Ctrl-a d       detach
#   Ctrl-a r       reload this config
#
# From your normal shell:
#
#   tmux new -s dev
#   tmux ls
#   tmux attach -t dev
#
# =============================================================================
